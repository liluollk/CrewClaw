<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d9488" />

    <!-- DM Sans: loaded locally via @font-face in globals.css -->

    <!-- 预热认证：AuthGuard 放行前整棵已登录子树都不渲染，若等入口 JS 执行后
         才发 /api/auth/me，这个 RTT 会和分片下载串行。这里在 HTML 解析阶段就
         发出请求，stores/auth.ts 一次性消费 window.__authPrewarm。 -->
    <script>
      window.__authPrewarm = fetch('%BASE_URL%api/auth/me', {
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
      }).catch(function () {
        return null;
      });
    </script>
    <title>智牧工作台</title>
    <script>
      (function () {
        var d = document.documentElement,
          s = localStorage.getItem('miniclaw-theme');
        if (
          s === 'dark' ||
          (s === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        )
          d.classList.add('dark');
        var c = localStorage.getItem('miniclaw-color-scheme');
        if (c === 'orange') d.classList.add('theme-orange');
        if (c === 'neutral') d.classList.add('theme-neutral');
        if (localStorage.getItem('miniclaw-font-style') === 'anthropic')
          d.classList.add('font-anthropic');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
